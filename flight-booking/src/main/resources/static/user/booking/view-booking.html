<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Booking</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body>

<header class="header">
    <nav class="top-nav">
        <div class="left-nav">
            <div class="logo">
                <img src="/images/Logo.png" class="Airline_Logo">
                <img src="/images/Star_Alliance.jpg" class="Star_Alliance">
            </div>
        </div>
        <div class="center-nav">
            <a href="/">Home</a>
            <a href="/manage">Manage</a>
            <a href="/support">Help</a>

        </div>
        <div class="right-nav">
            <span class="lang">United Kingdom - EN</span>
            <a href="/log_in">Log In</a>
        </div>
    </nav>
</header>

<section class="flights-overview-header">
    <div class="flights-overview">
        <h1>Your Booking</h1>
        <p>Booking reference details</p>
    </div>
</section>

<div id="booking-content"></div>
<p id="booking-error" style="max-width:700px;margin:24px auto;padding:0 20px;color:#c0392b;font-weight:600;"></p>

<script>
    const params = new URLSearchParams(window.location.search);
    const bookingId = params.get('bookingId');
    const lastName = params.get('lastName');

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll("\"", "&quot;")
            .replaceAll("'", "&#39;");
    }

    fetch(`/api/bookings/lookup?bookingId=${encodeURIComponent(bookingId)}&lastName=${encodeURIComponent(lastName)}`)
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('booking-content');
            const outboundSeats = Array.isArray(data.seats) ? data.seats : [];
            const returnSeats = Array.isArray(data.returnSeatNumbers)
                ? data.returnSeatNumbers
                : (Array.isArray(data.returnSeats) ? data.returnSeats : []);

            // booking info card
            container.insertAdjacentHTML('beforeend', `
                <div class="booking_page_1">
                    <h2>Booking Details</h2>
                    <p class="age-label">Your confirmed booking information</p>

                    <div class="user_input_box">
                        <label>Booking ID</label>
                        <input type="text" value="${data.bookingId}" disabled>
                    </div>

                    <div class="user_input_box">
                        <label>Flight</label>
                        <input type="text" value="${escapeHtml(data.flightId)}" disabled>
                    </div>

                    <div class="user_input_box">
                        <label>Seat(s)</label>
                        <input type="text" value="${escapeHtml(outboundSeats.join(', '))}" disabled>
                    </div>

                    <div class="user_input_box">
                        <label>Cabin Class</label>
                    <input type="text" value="${data.cabin ?? 'N/A'}" disabled>
                    </div>

                    <div class="user_input_box">
                        <label>Add-ons</label>
                        <input type="text" value="${formatAddOns(data.addOns)}" disabled>
                    </div>

                </div>


            `);

            if (data.returnFlightId) {
                container.insertAdjacentHTML('beforeend', `
                    <div class="booking_page_1" id="return-flight-section">
                        <h2>Return Flight</h2>
                        <p class="age-label">Return journey details</p>

                        <div class="user_input_box">
                            <label>Return flight</label>
                            <input type="text" value="${escapeHtml(data.returnFlightId)}" disabled>
                        </div>

                        <div class="user_input_box">
                            <label>Return seat(s)</label>
                            <input type="text" value="${escapeHtml(returnSeats.length > 0 ? returnSeats.join(', ') : 'Not available')}" disabled>
                        </div>
                    </div>
                `);
            }

            function formatAddOns(raw) {
                if (!raw) return 'None';
                try {
                    const obj = JSON.parse(raw);
                    const items = Object.values(obj).filter(Boolean);
                    return items.length ? items.join(', ') : 'None';
                } catch { return raw; }
            }


            // one card per passenger
            data.passengers.forEach((name, i) => {
                container.insertAdjacentHTML('beforeend', `
                    <div class="booking_page_1">
                        <h2>Passenger ${i + 1}</h2>
                        <div class="user_input_box">
                            <label>Full name</label>
                            <input type="text" value="${escapeHtml(name)}" disabled>
                        </div>
                    </div>
                `);
            });
        })
        .catch(() => {
            document.getElementById('booking-error').textContent = 'Could not load booking details.';
        });
</script>
<div class="footer-divider"></div>
<footer>
    <a href="/manager" class="footer-left">Operations Console</a>

    <div class="footer-center">
        <div class="footer-logos">
            <img src="/images/Award_1.png">
            <img src="/images/Award_2.png">
            <img src="/images/Award_3.png">
        </div>
        <p class="footer-info">
            © 2026 Astraeus Airlines · All rights reserved
        </p>
        <p class="footer-trust">
            Trusted worldwide · Secure booking · 24/7 support
        </p>
    </div>
    <div class="footer-right">Astraeus UK</div>
</footer>

</body>
</html>
